name: Deploy React App to Ubuntu Server

on:
  push:
    branches: ["react-web"]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}

      - name: Create production server files
        run: |
          # Create server.js
          echo 'const express = require("express");
          const path = require("path");
          const app = express();
          const port = process.env.PORT || 3000;

          app.use(express.static(path.join(__dirname)));

          app.get("*", (req, res) => {
            res.sendFile(path.join(__dirname, "index.html"));
          });

          app.listen(port, () => {
            console.log(`React app server running on port ${port}`);
          });' > server.js

          # Create package.json for production
          echo '{
            "name": "react-app-server",
            "version": "1.0.0",
            "description": "Simple server for React app",
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.18.2"
            }
          }' > package-production.json

      - name: Install express
        run: npm install express --save

      - name: Create systemd service file
        run: |
          # Create the service file as regular user first
          cat > react-app.service << 'EOF'
          [Unit]
          Description=React App Server
          After=network.target

          [Service]
          ExecStart=/usr/bin/node /home/ferytell/react-app/server.js
          WorkingDirectory=/home/ferytell/react-app
          User=ferytell
          Group=ferytell
          Restart=always
          Environment=NODE_ENV=production
          Environment=PORT=3000

          [Install]
          WantedBy=multi-user.target
          EOF

          # Then copy it with sudo
          sudo cp react-app.service /etc/systemd/system/
          sudo chmod 644 /etc/systemd/system/react-app.service

      - name: Deploy files to app directory
        run: |
          mkdir -p /home/ferytell/react-app
          cp -r build/* /home/ferytell/react-app/
          cp server.js /home/ferytell/react-app/
          cp package-production.json /home/ferytell/react-app/package.json

          # Set correct ownership
          sudo chown -R ferytell:ferytell /home/ferytell/react-app

      - name: Install production dependencies
        run: |
          cd /home/ferytell/react-app
          npm install --production

      - name: Setup and start service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable react-app
          sudo systemctl restart react-app
          echo "Service status:"
          sudo systemctl status react-app --no-pager -l

