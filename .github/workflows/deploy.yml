name: Deploy React App to Ubuntu Server

on:
  push:
    branches: ["react-web"]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}

      - name: Create production server files
        run: |
          # Create server.js
          cat > server.js << 'EOF'
          const express = require("express");
          const path = require("path");
          const app = express();
          const port = process.env.PORT || 3000;

          app.use(express.static(path.join(__dirname)));

          app.get("*", (req, res) => {
            res.sendFile(path.join(__dirname, "index.html"));
          });

          app.listen(port, () => {
            console.log(`React app server running on port ${port}`);
          });
          EOF

      - name: Install express
        run: npm install express --save

      - name: Deploy files to app directory
        run: |
          mkdir -p /home/ferytell/react-app
          cp -r build/* /home/ferytell/react-app/
          cp server.js /home/ferytell/react-app/

          # Create package.json for the app
          cat > /home/ferytell/react-app/package.json << 'EOF'
          {
            "name": "react-app-server",
            "version": "1.0.0",
            "description": "Simple server for React app",
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.18.2"
            }
          }
          EOF

      - name: Install production dependencies
        run: |
          cd /home/ferytell/react-app
          npm install --production

      - name: Setup PM2 for process management
        run: |
          # Install PM2 globally
          npm install -g pm2

          # Create PM2 ecosystem file
          cat > /home/ferytell/react-app/ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [{
              name: "react-app",
              script: "./server.js",
              instances: 1,
              autorestart: true,
              watch: false,
              max_memory_restart: "1G",
              env: {
                NODE_ENV: "production",
                PORT: 3000
              }
            }]
          }
          EOF

      - name: Start application with PM2
        run: |
          cd /home/ferytell/react-app

          # Stop existing instance if running
          pm2 delete react-app 2>/dev/null || true

          # Start new instance
          pm2 start ecosystem.config.js

          # Save PM2 process list
          pm2 save

          # Setup startup script (only need to do this once)
          if ! pm2 startup 2>/dev/null; then
            echo "PM2 startup already configured"
          fi

          # List running processes
          pm2 list

          echo "React app deployed successfully!"
          echo "App should be available at: http://localhost:3000"

