name: Deploy React App to Ubuntu Server

on:
  push:
    branches: ["react-web"]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r build/* deploy/
          # Create a simple server for SPA routing if needed
          echo '{
            "name": "react-app-server",
            "version": "1.0.0",
            "description": "Simple server for React app",
            "main": "server.js",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.18.2",
              "path": "^0.12.7"
            }
          }' > deploy/package.json

          echo 'const express = require("express");
          const path = require("path");
          const app = express();
          const port = process.env.PORT || 3000;

          // Serve static files from the build directory
          app.use(express.static(path.join(__dirname)));

          // Handle client-side routing
          app.get("*", (req, res) => {
            res.sendFile(path.join(__dirname, "index.html"));
          });

          app.listen(port, () => {
            console.log(`Server running on port ${port}`);
          });' > deploy/server.js

      - name: Copy files to Ubuntu server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy/*"
          target: "/home/ferytell/react-app/"

      - name: Install and start on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /home/ferytell/react-app/
            npm install
            # Setup systemd service for React app
            echo "[Unit]
            Description=React App Server
            After=network.target

            [Service]
            ExecStart=/usr/bin/npm start
            WorkingDirectory=/home/ferytell/react-app
            User=ferytell
            Group=ferytell
            Restart=always
            Environment=NODE_ENV=production
            Environment=PORT=3000

            [Install]
            WantedBy=multi-user.target" | sudo tee /etc/systemd/system/react-app.service

            sudo systemctl daemon-reload
            sudo systemctl enable react-app
            sudo systemctl restart react-app

